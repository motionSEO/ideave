<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForUs Reference Prototype</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --surface: #ffffff;
      --surface-2: #eeeeeb;
      --ink: #171717;
      --ink-soft: #333333;
      --muted: #777777;
      --line: #ddddda;
      --line-strong: #bdbdb8;
      --image: #d3d3d0;
      --image-dark: #c3c3bf;
      --green: #171717;
      --clay: #171717;
      --mustard: #8a8a84;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .memo-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 82px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 246, 244, 0.94);
      backdrop-filter: blur(12px);
    }

    .logo-home {
      position: absolute;
      left: 22px;
      padding: 0;
      color: var(--ink);
      background: transparent;
    }

    .memo-bar .garden-mark {
      position: absolute;
      right: 22px;
    }

    .memo-card {
      display: grid;
      justify-items: center;
      gap: 4px;
      width: min(720px, 100%);
      min-height: 58px;
      padding: 9px 18px 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ececea;
    }

    .memo-card span {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .memo-bar input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      text-align: center;
    }

    .memo-bar input::placeholder,
    .search input::placeholder {
      color: var(--muted);
    }

    .app-header {
      position: sticky;
      top: 82px;
      z-index: 45;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      align-items: center;
      gap: 22px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 246, 244, 0.92);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0;
    }

    .brand i {
      color: var(--clay);
      font-style: italic;
    }

    .garden-mark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--clay);
      box-shadow: inset 0 0 0 1px rgba(36, 31, 27, 0.08);
    }

    .main-nav {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      justify-self: end;
      padding: 0;
    }

    .nav-btn,
    .pill,
    .tag-btn,
    .icon-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .nav-btn {
      min-width: 74px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 13px;
    }

    .nav-btn.active {
      background: var(--ink);
      color: var(--surface);
    }

    .search {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: calc(100vh - 143px);
    }

    .workspace.board-open {
      grid-template-columns: minmax(0, 1fr) minmax(340px, 31vw);
    }

    .digging-pane {
      min-width: 0;
      padding: 28px 24px 56px;
    }

    .intro-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title-stack h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 72px);
      line-height: 0.94;
      font-weight: 400;
      letter-spacing: 0;
    }

    .title-stack p {
      max-width: 540px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      min-width: 0;
    }

    .filter-group {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
      flex: 0 0 auto;
    }

    .pill,
    .tag-btn {
      gap: 6px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .pill:hover,
    .tag-btn:hover,
    .icon-action:hover {
      border-color: var(--ink);
      transform: translateY(-1px);
    }

    .pill.active,
    .tag-btn.active {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--surface);
    }

    .tag-rail {
      display: flex;
      gap: 7px;
      padding: 0;
      overflow-x: auto;
      scrollbar-width: none;
      min-width: 0;
      flex: 1 1 auto;
      justify-content: flex-start;
    }

    .tag-rail::-webkit-scrollbar { display: none; }

    .selection-panel {
      margin: 0 0 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .selection-header,
    .section-header,
    .board-header,
    .board-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .selection-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .selection-title,
    .section-header h2,
    .board-header h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: 0;
    }

    .selection-title {
      font-size: 21px;
    }

    .selection-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .selection-body {
      display: grid;
      grid-template-columns: minmax(240px, 0.95fr) minmax(260px, 1fr);
      gap: 18px;
      padding: 18px;
    }

    .selected-tags {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 30px;
    }

    .focus-image,
    .image-box,
    .board-image {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, transparent 49.2%, rgba(20, 22, 18, 0.055) 49.2%, rgba(20, 22, 18, 0.055) 50.8%, transparent 50.8%),
        var(--shade, var(--image));
      background-size: 22px 22px, auto;
    }

    .focus-image {
      min-height: 280px;
      border-radius: 8px;
      border: 1px solid var(--line);
      cursor: grab;
    }

    .focus-image:active,
    .ref-card:active {
      cursor: grabbing;
    }

    .definition-sheet {
      display: grid;
      align-content: start;
      gap: 14px;
      min-height: 220px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .definition-term {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 62px);
      line-height: 0.96;
      font-weight: 400;
    }

    .definition-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
    }

    .definition-list div {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .definition-list dt {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .definition-list dd {
      margin: 0;
      color: var(--ink-soft);
    }

    .selection-copy {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .signal {
      min-height: 78px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }

    .signal b {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 12px;
    }

    .signal span {
      color: var(--muted);
      font-size: 12px;
    }

    .section-header {
      margin: 22px 0 14px;
    }

    .section-header h2 {
      font-size: 26px;
    }

    .section-header span {
      color: var(--muted);
      font-size: 12px;
    }

    .masonry {
      column-count: 5;
      column-gap: 14px;
    }

    .masonry .ref-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 14px;
    }

    .masonry .ref-card.text-ref {
      display: grid;
      place-items: center;
    }

    .ref-card {
      break-inside: avoid;
      border-radius: 8px;
      outline: 0;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      cursor: pointer;
    }

    .ref-card:hover,
    .ref-card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(27, 32, 24, 0.1);
    }

    .ref-card.selected {
      box-shadow: 0 0 0 2px var(--green);
    }

    .top-focus-panel {
      margin: 0 0 24px;
      scroll-margin-top: 156px;
    }

    .top-focus-panel:empty {
      display: none;
    }

    .top-focus-panel .ref-card.expanded {
      display: block;
      width: 100%;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: default;
    }

    .ref-card.expanded:hover,
    .ref-card.expanded:focus-visible {
      transform: none;
    }

    .expanded-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
    }

    .expanded-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .expanded-detail {
      display: grid;
      grid-template-columns: minmax(220px, 390px) minmax(0, 1fr);
      align-items: stretch;
      gap: 12px;
      padding: 12px 16px 16px;
    }

    .expanded-detail.text-only {
      grid-template-columns: 1fr;
    }

    .expanded-image {
      width: 100%;
      height: 292px;
      min-height: 0;
      aspect-ratio: auto !important;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .expanded-note {
      display: grid;
      align-content: start;
      gap: 12px;
      height: 100%;
      min-height: 292px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .expanded-note .expanded-head {
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .expanded-note .tag-btn {
      min-height: 60px;
      padding: 0 24px;
      border-radius: 999px;
      font-size: 24px;
    }

    .keyword-title {
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.05;
    }

    .note-actions {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .image-ref {
      background: transparent;
    }

    .image-box {
      width: 100%;
      min-height: 128px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .text-ref {
      display: grid;
      min-height: 132px;
      place-items: center;
      padding: 22px 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      aspect-ratio: var(--text-ratio, auto);
    }

    .keyword-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1;
      letter-spacing: 0;
      text-align: center;
    }

    .algorithm-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .algorithm-grid .ref-card {
      min-width: 0;
    }

    .algorithm-grid .image-box {
      min-height: 110px;
    }

    .algorithm-grid .text-ref {
      min-height: 110px;
    }

    .board-panel {
      position: sticky;
      top: 143px;
      display: none;
      height: calc(100vh - 143px);
      min-width: 0;
      border-left: 1px solid var(--line);
      background: var(--surface);
    }

    .workspace.board-open .board-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .board-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .board-header h2 {
      font-size: 25px;
    }

    .icon-action {
      min-width: 30px;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      font-size: 13px;
    }

    .board-canvas {
      position: relative;
      min-height: 420px;
      margin: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        #ffffff;
      background-size: 28px 28px;
      overflow: hidden;
    }

    .board-canvas.is-panning {
      cursor: grabbing;
    }

    .board-zoom-layer {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    .board-canvas.is-over {
      border-color: var(--green);
      box-shadow: inset 0 0 0 2px rgba(47, 107, 85, 0.22);
    }

    .board-selection {
      position: absolute;
      z-index: 5;
      border: 1px solid var(--green);
      background: rgba(47, 107, 85, 0.12);
      pointer-events: none;
    }

    .empty-board {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      pointer-events: none;
    }

    .board-item {
      position: absolute;
      width: 136px;
      height: 104px;
      min-width: 86px;
      min-height: 74px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgba(27, 32, 24, 0.13);
      overflow: visible;
      touch-action: none;
      cursor: move;
    }

    .board-item.board-selected {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(47, 107, 85, 0.4), 0 10px 24px rgba(27, 32, 24, 0.13);
    }

    .board-item .remove {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 2;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-size: 12px;
    }

    .resize-handle {
      position: absolute;
      right: -6px;
      bottom: -6px;
      z-index: 3;
      width: 14px;
      height: 14px;
      border: 1px solid var(--green);
      border-radius: 50%;
      background: var(--surface);
      cursor: nwse-resize;
    }

    .board-image {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border-radius: 7px;
    }

    .board-keyword {
      display: grid;
      width: 100%;
      height: 100%;
      min-height: 100%;
      place-items: center;
      padding: 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      background: var(--surface-2);
    }

    .board-footer {
      padding: 12px 18px 18px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    .clear-board {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .board-actions {
      display: inline-flex;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 1240px) {
      .masonry { column-count: 4; }
      .algorithm-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .selection-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 920px) {
      .app-header {
        top: 82px;
        grid-template-columns: 1fr auto;
      }

      .main-nav { grid-column: 2; grid-row: 1; justify-self: end; }
      .search,
      .result-count {
        grid-column: 1 / -1;
      }

      .workspace.board-open {
        grid-template-columns: 1fr;
      }

      .board-panel {
        position: relative;
        top: 0;
        height: 70vh;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .masonry { column-count: 3; }
      .intro-row { align-items: start; flex-direction: column; }
      .toolbar-row { align-items: stretch; flex-direction: column; justify-content: flex-start; }
      .filter-group { justify-content: flex-end; }
      .tag-rail { justify-content: flex-start; width: 100%; }
      .expanded-detail { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .memo-bar,
      .app-header {
        padding-left: 14px;
        padding-right: 14px;
      }

      .digging-pane {
        padding: 22px 14px 44px;
      }

      .masonry { column-count: 2; column-gap: 10px; }
      .masonry .ref-card { margin-bottom: 10px; }
      .algorithm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .signal-grid { grid-template-columns: 1fr; }
      .selection-body { padding: 12px; }
      .definition-list div { grid-template-columns: 1fr; gap: 4px; }
      .expanded-head { align-items: flex-start; flex-direction: column; }
      .expanded-detail { padding: 12px; }
      .expanded-image { height: 200px; min-height: 0; }
      .workspace.board-open .board-panel { height: 74vh; }
    }
  </style>
</head>
<body>
  <div class="memo-bar">
    <button class="brand logo-home" type="button" id="homeLogo" aria-label="홈으로 돌아가기">ForUs<i>.</i></button>
    <div class="memo-card">
      <span>MEMO</span>
      <label class="sr-only" for="quickMemo">한줄메모</label>
      <input id="quickMemo" type="text" maxlength="90" placeholder="한줄메모">
    </div>
    <div class="garden-mark" aria-label="정원"></div>
  </div>

  <header class="app-header">
    <label class="search">
      <span class="sr-only">검색</span>
      <input id="searchInput" type="search" placeholder="해시태그 또는 키워드 검색">
    </label>
    <div class="result-count" id="resultCount">48 references</div>
    <nav class="main-nav" aria-label="주요 메뉴">
      <button class="nav-btn" type="button" id="boardToggle" data-nav="board">Board</button>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <section class="digging-pane" aria-label="Digging">
      <div class="toolbar-row">

  <script>
    const references = [
      { id: "img-01", type: "image", ratio: "4 / 5", shade: "#cfd4ce", tags: ["질감", "여백", "정적"] },
      { id: "txt-01", type: "text", ratio: "1 / 1", tags: ["키워드", "정의", "언어"] },
      { id: "img-02", type: "image", ratio: "16 / 10", shade: "#c4cac2", tags: ["구조", "레이아웃", "반복"] },
      { id: "img-03", type: "image", ratio: "3 / 4", shade: "#d8d9d2", tags: ["형태", "비례", "오브젝트"] },
      { id: "txt-02", type: "text", ratio: "4 / 3", tags: ["키워드", "연상", "감정"] },
      { id: "img-04", type: "image", ratio: "1 / 1", shade: "#bec7c1", tags: ["색감", "차분함", "톤"] },
      { id: "img-05", type: "image", ratio: "2 / 3", shade: "#d1d0ca", tags: ["패턴", "질감", "반복"] },
      { id: "txt-03", type: "text", ratio: "5 / 4", tags: ["키워드", "문장", "리듬"] },
      { id: "img-06", type: "image", ratio: "5 / 4", shade: "#c8d0c8", tags: ["여백", "균형", "정적"] },
      { id: "img-07", type: "image", ratio: "3 / 5", shade: "#d6d8d4", tags: ["소재", "표면", "촉감"] },
      { id: "txt-04", type: "text", ratio: "1 / 1", tags: ["키워드", "정의", "비유"] },
      { id: "img-08", type: "image", ratio: "4 / 3", shade: "#c2c9c4", tags: ["구도", "레이어", "공간"] },
      { id: "img-09", type: "image", ratio: "9 / 12", shade: "#d3d5cf", tags: ["타이포", "대비", "리듬"] },
      { id: "txt-05", type: "text", ratio: "4 / 3", tags: ["키워드", "수집", "맥락"] },
      { id: "img-10", type: "image", ratio: "1 / 1", shade: "#c9d1cc", tags: ["색감", "대비", "분위기"] },
      { id: "img-11", type: "image", ratio: "16 / 9", shade: "#d4d2cb", tags: ["공간", "여백", "수평"] },
      { id: "txt-06", type: "text", ratio: "1 / 1", tags: ["키워드", "연상", "방향"] },
      { id: "img-12", type: "image", ratio: "4 / 5", shade: "#c1c8bf", tags: ["형태", "구조", "균형"] },
      { id: "img-13", type: "image", ratio: "5 / 7", shade: "#d6d8d1", tags: ["표면", "빛", "질감"] },
      { id: "txt-07", type: "text", ratio: "4 / 3", tags: ["키워드", "감정", "언어"] },
      { id: "img-14", type: "image", ratio: "4 / 3", shade: "#c8cec6", tags: ["레이아웃", "리듬", "간격"] },
      { id: "img-15", type: "image", ratio: "3 / 4", shade: "#d8d6cf", tags: ["오브젝트", "소재", "톤"] },
      { id: "txt-08", type: "text", ratio: "1 / 1", tags: ["키워드", "비유", "문장"] },
      { id: "img-16", type: "image", ratio: "1 / 1", shade: "#c3cbc5", tags: ["색감", "차분함", "정적"] }
    ];

    const neutralShades = ["#d3d3d0", "#c9c9c6", "#dededb", "#c1c1bd", "#d8d8d5"];
    const textRatios = ["1 / 1", "4 / 3", "5 / 4", "3 / 4", "16 / 10", "2 / 3"];
    let textIndex = 0;
    references.forEach((ref, index) => {
      if (ref.type === "image") ref.shade = neutralShades[index % neutralShades.length];
      if (ref.type === "text") ref.ratio = textRatios[textIndex++ % textRatios.length];
    });
    references.push(...references.map((ref, index) => ({
      ...ref,
      id: `${ref.id}-more`,
      ratio: ref.type === "image" ? ["4 / 5", "1 / 1", "16 / 10", "3 / 4", "5 / 7"][index % 5] : textRatios[textIndex++ % textRatios.length],
      shade: ref.type === "image" ? neutralShades[(index + 2) % neutralShades.length] : ref.shade
    })));

    const tagSet = ["여백", "질감", "정적", "구조", "레이아웃", "형태", "색감", "패턴", "키워드", "정의", "연상", "리듬", "공간"];
    const state = {
      filter: "all",
      query: "",
      selectedId: "",
      boardItems: loadBoard(),
      selectedBoardIds: new Set(),
      boardZoom: 1,
      boardPanX: 0,
      boardPanY: 0
    };

    const els = {
      workspace: document.getElementById("workspace"),
      memo: document.getElementById("quickMemo"),
      search: document.getElementById("searchInput"),
      resultCount: document.getElementById("resultCount"),
      tagRail: document.getElementById("tagRail"),
      topFocusPanel: document.getElementById("topFocusPanel"),
      referenceGrid: document.getElementById("referenceGrid"),
      algorithmGrid: document.getElementById("algorithmGrid"),
      algorithmLabel: document.getElementById("algorithmLabel"),
      queryLabel: document.getElementById("queryLabel"),
      boardToggle: document.getElementById("boardToggle"),
      closeBoard: document.getElementById("closeBoard"),
      boardCanvas: document.getElementById("boardCanvas"),
      boardZoomLayer: document.getElementById("boardZoomLayer"),
      emptyBoard: document.getElementById("emptyBoard"),
      savedCount: document.getElementById("savedCount"),
      clearBoard: document.getElementById("clearBoard"),
      saveBoardImage: document.getElementById("saveBoardImage"),
      homeLogo: document.getElementById("homeLogo")
    };

    els.memo.value = localStorage.getItem("forus.memo") || "";
    els.memo.addEventListener("input", () => localStorage.setItem("forus.memo", els.memo.value));

    function loadBoard() {
      try {
        return JSON.parse(localStorage.getItem("forus.board") || "[]");
      } catch {
        return [];
      }
    }

    function saveBoard() {
      localStorage.setItem("forus.board", JSON.stringify(state.boardItems));
    }

    function byId(id) {
      return references.find((item) => item.id === id);
    }

    function cleanTerm(value) {
      return value.trim().replace(/^#/, "");
    }

    function matchesTerm(ref, term) {
      if (!term) return true;
      const lower = term.toLowerCase();
      if (ref.type === "text" && "키워드".includes(term)) return true;
      return ref.tags.some((tag) => tag.toLowerCase().includes(lower));
    }

    function getFilteredRefs() {
      return references.filter((ref) => {
        const typeOk = state.filter === "all" || ref.type === state.filter;
        return typeOk && matchesTerm(ref, state.query);
      });
    }

    function expandedTags(ref) {
      return ref.tags.map((tag) => `<button class="tag-btn" type="button" data-tag="${tag}">#${tag}</button>`).join("");
    }

    function focusMarkup(ref) {
      const attrs = `class="ref-card expanded-ref selected expanded" data-id="${ref.id}" draggable="true" tabindex="0"`;

      if (ref.type === "image") {
        return `
          <article ${attrs}>
            <div class="expanded-detail">
              <div class="focus-image expanded-image" style="aspect-ratio:${ref.ratio}; --shade:${ref.shade}"></div>
              <div class="expanded-note">
                <div class="expanded-head">
                  <div class="expanded-tags">${expandedTags(ref)}</div>
                  <div class="note-actions">
                    <button class="pill" type="button" data-save="${ref.id}">Board에 저장</button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        `;
      }

      return `
        <article ${attrs}>
          <div class="expanded-head">
            <div class="expanded-tags">${expandedTags(ref)}</div>
            <button class="pill" type="button" data-save="${ref.id}">Board에 저장</button>
          </div>
          <div class="expanded-detail text-only">
            <div class="definition-sheet">
              <p class="definition-term">키워드</p>
              <dl class="definition-list">
                <div><dt>정의</dt><dd>아이디어의 중심을 붙잡기 위해 선택하는 단어.</dd></div>
                <div><dt>기능</dt><dd>이미지, 문장, 소재를 같은 방향으로 묶는 검색의 기준.</dd></div>
                <div><dt>연상</dt><dd>정의에서 출발해 분위기, 형태, 색감으로 확장되는 단서.</dd></div>
              </dl>
            </div>
          </div>
        </article>
      `;
    }

    function cardMarkup(ref, compact = false) {
      const selected = ref.id === state.selectedId ? " selected" : "";
      const attrs = `class="ref-card ${ref.type === "image" ? "image-ref" : "text-ref"}${selected}" data-id="${ref.id}" draggable="true" tabindex="0"`;

      if (ref.type === "image") {
        const ratio = compact ? "4 / 3" : ref.ratio;
        return `<article ${attrs}><div class="image-box" style="aspect-ratio:${ratio}; --shade:${ref.shade}"></div></article>`;
      }
      return `<article ${attrs} style="--text-ratio:${compact ? "4 / 3" : ref.ratio};"><div class="keyword-label">키워드</div></article>`;
    }

    function attachCardEvents(root) {
      root.querySelectorAll(".ref-card").forEach((card) => {
        const id = card.dataset.id;
        card.addEventListener("click", (event) => {
          const tagButton = event.target.closest("[data-tag]");
          const saveButton = event.target.closest("[data-save]");
          if (tagButton) {
            event.stopPropagation();
            runSearch(tagButton.dataset.tag);
            return;
          }
          if (saveButton) {
            event.stopPropagation();
            openBoard();
            addBoardItem(saveButton.dataset.save);
            return;
          }
          selectReference(id);
        });
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectReference(id);
          }
        });
        card.addEventListener("dragstart", (event) => {
          const ref = byId(id);
          event.dataTransfer.setData("application/json", JSON.stringify({ refId: ref.id }));
          event.dataTransfer.effectAllowed = "copy";
          openBoard();
        });
      });
    }

    function renderTags() {
      els.tagRail.innerHTML = tagSet.map((tag) => {
        const active = state.query === tag ? " active" : "";
        return `<button class="tag-btn${active}" type="button" data-tag="${tag}">#${tag}</button>`;
      }).join("");
      els.tagRail.querySelectorAll("[data-tag]").forEach((button) => {
        button.addEventListener("click", () => runSearch(button.dataset.tag));
      });
    }

    function renderGrid() {
      const list = getFilteredRefs();
      els.referenceGrid.innerHTML = list.map((ref) => cardMarkup(ref)).join("");
      attachCardEvents(els.referenceGrid);
      els.resultCount.textContent = `${list.length} references`;
      els.queryLabel.textContent = state.query ? `#${state.query}` : "today's mix";
    }

    function renderTopFocus() {
      const selected = byId(state.selectedId);
      els.topFocusPanel.innerHTML = selected ? focusMarkup(selected) : "";
      attachCardEvents(els.topFocusPanel);
    }

    function renderSelection() {
      if (!els.selectionPanel) return;
      const selected = byId(state.selectedId) || references[0];
      const tagButtons = selected.tags.map((tag) => `<button class="tag-btn" type="button" data-tag="${tag}">#${tag}</button>`).join("");
      const saveButton = `<button class="pill" type="button" id="saveSelected">Board에 저장</button>`;

      if (selected.type === "image") {
        els.selectionPanel.innerHTML = `
          <div class="selection-header">
            <div>
              <h2 class="selection-title">Image reference</h2>
              <div class="selection-meta">visual seed</div>
            </div>
            ${saveButton}
          </div>
          <div class="selection-body">
            <div class="selected-tags">${tagButtons}</div>
            <div class="focus-image" draggable="true" data-id="${selected.id}" style="aspect-ratio:${selected.ratio}; --shade:${selected.shade}"></div>
            <div class="selection-copy">
              <div class="signal-grid">
                <div class="signal"><b>Shape</b><span>${selected.tags[0] || "형태"}</span></div>
                <div class="signal"><b>Mood</b><span>${selected.tags[1] || "분위기"}</span></div>
                <div class="signal"><b>Link</b><span>${selected.tags[2] || "맥락"}</span></div>
              </div>
              <div class="definition-sheet">
                <p class="definition-term">image</p>
                <dl class="definition-list">
                  <div><dt>Seed</dt><dd>${selected.tags.map((tag) => "#" + tag).join(" ")}</dd></div>
                  <div><dt>Mode</dt><dd>similar references, keyword search, board save</dd></div>
                </dl>
              </div>
            </div>
          </div>
        `;
      } else {
        els.selectionPanel.innerHTML = `
          <div class="selection-header">
            <div>
              <h2 class="selection-title">Text definition</h2>
              <div class="selection-meta">dictionary seed</div>
            </div>
            ${saveButton}
          </div>
          <div class="selection-body">
            <div class="selected-tags">${tagButtons}</div>
            <div class="definition-sheet">
              <p class="definition-term">키워드</p>
              <dl class="definition-list">
                <div><dt>정의</dt><dd>아이디어의 중심을 붙잡기 위해 선택하는 단어.</dd></div>
                <div><dt>기능</dt><dd>이미지, 문장, 소재를 같은 방향으로 묶는 검색의 기준.</dd></div>
                <div><dt>연상</dt><dd>정의에서 출발해 분위기, 형태, 색감으로 확장되는 단서.</dd></div>
              </dl>
            </div>
            <div class="selection-copy">
              <div class="signal-grid">
                <div class="signal"><b>Word</b><span>키워드</span></div>
                <div class="signal"><b>Meaning</b><span>정의</span></div>
                <div class="signal"><b>References</b><span>image + text</span></div>
              </div>
              <div class="text-ref" draggable="true" data-id="${selected.id}"><div class="keyword-label">키워드</div></div>
            </div>
          </div>
        `;
      }

      els.selectionPanel.querySelectorAll("[data-tag]").forEach((button) => {
        button.addEventListener("click", () => runSearch(button.dataset.tag));
      });

      const saveSelected = document.getElementById("saveSelected");
      saveSelected.addEventListener("click", () => {
        openBoard();
        addBoardItem(selected.id);
      });

      els.selectionPanel.querySelectorAll("[draggable='true'][data-id]").forEach((node) => {
        node.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("application/json", JSON.stringify({ refId: node.dataset.id }));
          event.dataTransfer.effectAllowed = "copy";
          openBoard();
        });
      });
    }

    function relatedRefs(seedRef, termOverride = "") {
      const terms = termOverride ? [termOverride] : seedRef.tags;
      const scored = references
        .filter((ref) => ref.id !== seedRef.id)
        .map((ref) => ({
          ref,
          score: ref.tags.reduce((sum, tag) => sum + (terms.includes(tag) ? 1 : 0), 0)
        }))
        .sort((a, b) => b.score - a.score);

      const strong = scored.filter((item) => item.score > 0).map((item) => item.ref);
      const fill = scored.filter((item) => item.score === 0).map((item) => item.ref);
      return [...strong, ...fill].slice(0, 12);
    }

    function renderAlgorithm(termOverride = "") {
      const selected = byId(state.selectedId);
      const seed = selected || references[0];
      const list = selected ? relatedRefs(seed, termOverride || state.query) : references.slice(0, 12);
      els.algorithmGrid.innerHTML = list.map((ref) => cardMarkup(ref, true)).join("");
      attachCardEvents(els.algorithmGrid);
      els.algorithmLabel.textContent = termOverride || state.query ? `#${termOverride || state.query}` : selected ? (selected.type === "image" ? "selected image" : "selected text") : "pick a reference";
    }

    function selectReference(id) {
      state.selectedId = id;
      renderTopFocus();
      renderGrid();
      renderAlgorithm();
      els.topFocusPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function runSearch(term) {
      const nextQuery = cleanTerm(term);
      state.query = state.query === nextQuery ? "" : nextQuery;
      els.search.value = state.query ? `#${state.query}` : "";
      renderTags();
      renderTopFocus();
      renderGrid();
      renderAlgorithm(state.query);
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });
      renderTopFocus();
      renderGrid();
    }

    function goHome() {
      state.selectedId = "";
      state.query = "";
      els.search.value = "";
      setFilter("all");
      renderTags();
      renderTopFocus();
      renderGrid();
      renderAlgorithm();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openBoard() {
      els.workspace.classList.add("board-open");
      els.boardToggle.classList.add("active");
    }

    function closeBoard() {
      els.workspace.classList.remove("board-open");
      els.boardToggle.classList.remove("active");
    }

    function addBoardItem(refId, left, top) {
      const bounds = boardViewportBounds();
      const item = {
        id: `board-${Date.now()}-${Math.round(Math.random() * 9999)}`,
        refId,
        left: Number.isFinite(left) ? left : Math.max(bounds.left + 18, Math.min(bounds.right - 158, bounds.left + 36 + state.boardItems.length * 18)),
        top: Number.isFinite(top) ? top : Math.max(bounds.top + 18, Math.min(bounds.bottom - 126, bounds.top + 38 + state.boardItems.length * 20)),
        width: 136,
        height: 104
      };
      state.boardItems.push(item);
      state.selectedBoardIds.clear();
      state.selectedBoardIds.add(item.id);
      saveBoard();
      renderBoard();
    }

    function renderBoard() {
      els.boardZoomLayer.querySelectorAll(".board-item").forEach((node) => node.remove());
      state.boardItems.forEach((item) => {
        const ref = byId(item.refId);
        if (!ref) return;
        const node = document.createElement("div");
        node.className = "board-item";
        if (state.selectedBoardIds.has(item.id)) node.classList.add("board-selected");
        node.dataset.boardId = item.id;
        node.style.left = `${item.left}px`;
        node.style.top = `${item.top}px`;
        node.style.width = `${item.width || 136}px`;
        node.style.height = `${item.height || 104}px`;
        node.innerHTML = ref.type === "image"
          ? `<button class="remove" type="button" aria-label="삭제">X</button><div class="board-image" style="--shade:${ref.shade}"></div><span class="resize-handle" aria-hidden="true"></span>`
          : `<button class="remove" type="button" aria-label="삭제">X</button><div class="board-keyword">키워드</div><span class="resize-handle" aria-hidden="true"></span>`;
        els.boardZoomLayer.appendChild(node);
        makeBoardItemMovable(node, item);
      });
      els.emptyBoard.style.display = state.boardItems.length ? "none" : "grid";
      els.savedCount.textContent = `${state.boardItems.length} saved`;
      updateBoardZoom();
    }

    function updateBoardSelectionStyles() {
      els.boardZoomLayer.querySelectorAll(".board-item").forEach((node) => {
        node.classList.toggle("board-selected", state.selectedBoardIds.has(node.dataset.boardId));
      });
    }

    function rectsOverlap(a, b) {
      return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
    }

    function updateBoardZoom() {
      els.boardZoomLayer.style.transform = `translate(${state.boardPanX}px, ${state.boardPanY}px) scale(${state.boardZoom})`;
    }

    function boardPointFromEvent(event) {
      const rect = els.boardCanvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left - state.boardPanX) / state.boardZoom,
        y: (event.clientY - rect.top - state.boardPanY) / state.boardZoom
      };
    }

    function boardViewportBounds() {
      const rect = els.boardCanvas.getBoundingClientRect();
      return {
        left: -state.boardPanX / state.boardZoom,
        top: -state.boardPanY / state.boardZoom,
        right: (rect.width - state.boardPanX) / state.boardZoom,
        bottom: (rect.height - state.boardPanY) / state.boardZoom,
        width: rect.width / state.boardZoom,
        height: rect.height / state.boardZoom
      };
    }

    function makeBoardItemMovable(node, item) {
      const remove = node.querySelector(".remove");
      const resizeHandle = node.querySelector(".resize-handle");
      remove.addEventListener("click", (event) => {
        event.stopPropagation();
        state.boardItems = state.boardItems.filter((entry) => entry.id !== item.id);
        state.selectedBoardIds.delete(item.id);
        saveBoard();
        renderBoard();
      });

      let startX = 0;
      let startY = 0;
      let groupOrigins = [];
      let resizeOrigins = [];
      let moving = false;
      let resizing = false;

      function selectedBoardItems() {
        return state.boardItems.filter((entry) => state.selectedBoardIds.has(entry.id));
      }

      function updateBoardItemNode(entry) {
        const target = els.boardZoomLayer.querySelector(`[data-board-id="${entry.id}"]`);
        if (!target) return;
        target.style.left = `${entry.left}px`;
        target.style.top = `${entry.top}px`;
        target.style.width = `${entry.width || 136}px`;
        target.style.height = `${entry.height || 104}px`;
      }

      node.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        if (event.target === remove || event.target === resizeHandle) return;
        if (!state.selectedBoardIds.has(item.id)) {
          if (!event.shiftKey) state.selectedBoardIds.clear();
          state.selectedBoardIds.add(item.id);
        }
        updateBoardSelectionStyles();
        moving = true;
        const point = boardPointFromEvent(event);
        startX = point.x;
        startY = point.y;
        groupOrigins = selectedBoardItems().map((entry) => ({
          entry,
          left: entry.left,
          top: entry.top,
          width: entry.width || 136,
          height: entry.height || 104
        }));
        node.setPointerCapture(event.pointerId);
      });

      node.addEventListener("pointermove", (event) => {
        const bounds = boardViewportBounds();
        const point = boardPointFromEvent(event);
        if (moving) {
          let dx = point.x - startX;
          let dy = point.y - startY;
          const minDx = Math.max(...groupOrigins.map((origin) => bounds.left + 8 - origin.left));
          const maxDx = Math.min(...groupOrigins.map((origin) => bounds.right - origin.width - 8 - origin.left));
          const minDy = Math.max(...groupOrigins.map((origin) => bounds.top + 8 - origin.top));
          const maxDy = Math.min(...groupOrigins.map((origin) => bounds.bottom - origin.height - 8 - origin.top));
          dx = Math.max(minDx, Math.min(maxDx, dx));
          dy = Math.max(minDy, Math.min(maxDy, dy));
          groupOrigins.forEach((origin) => {
            origin.entry.left = origin.left + dx;
            origin.entry.top = origin.top + dy;
            updateBoardItemNode(origin.entry);
          });
        }

        if (resizing) {
          const dx = point.x - startX;
          const dy = point.y - startY;
          resizeOrigins.forEach((origin) => {
            origin.entry.width = Math.max(86, Math.min(bounds.right - origin.entry.left - 8, origin.width + dx));
            origin.entry.height = Math.max(74, Math.min(bounds.bottom - origin.entry.top - 8, origin.height + dy));
            updateBoardItemNode(origin.entry);
          });
        }
      });

      node.addEventListener("pointerup", (event) => {
        if (!moving && !resizing) return;
        moving = false;
        resizing = false;
        node.releasePointerCapture(event.pointerId);
        saveBoard();
      });

      resizeHandle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.stopPropagation();
        if (!state.selectedBoardIds.has(item.id)) {
          if (!event.shiftKey) state.selectedBoardIds.clear();
          state.selectedBoardIds.add(item.id);
          updateBoardSelectionStyles();
        }
        resizing = true;
        const point = boardPointFromEvent(event);
        startX = point.x;
        startY = point.y;
        resizeOrigins = selectedBoardItems().map((entry) => ({
          entry,
          width: entry.width || 136,
          height: entry.height || 104
        }));
        node.setPointerCapture(event.pointerId);
      });
    }

    els.search.addEventListener("input", () => {
      state.query = cleanTerm(els.search.value);
      renderTags();
      renderGrid();
      renderAlgorithm(state.query);
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    els.boardToggle.addEventListener("click", () => {
      if (els.workspace.classList.contains("board-open")) closeBoard();
      else openBoard();
    });

    els.closeBoard.addEventListener("click", closeBoard);
    els.clearBoard.addEventListener("click", () => {
      state.boardItems = [];
      state.selectedBoardIds.clear();
      saveBoard();
      renderBoard();
    });

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function boardItemSvg(item) {
      const ref = byId(item.refId);
      if (!ref) return "";
      const x = Number(item.left || 0);
      const y = Number(item.top || 0);
      const width = Number(item.width || 136);
      const height = Number(item.height || 104);
      if (ref.type === "image") {
        const shade = escapeXml(ref.shade || "#d3d3d0");
        return `
          <g>
            <rect x="${x}" y="${y}" width="${width}" height="${height}" rx="8" fill="${shade}" stroke="#bdbdb8"/>
            <path d="${Array.from({ length: Math.ceil((width + height) / 22) + 1 }, (_, i) => {
              const offset = i * 22 - height;
              return `M ${x + offset} ${y + height} L ${x + offset + height} ${y}`;
            }).join(" ")}" stroke="rgba(23,23,23,0.08)" stroke-width="1" fill="none"/>
          </g>
        `;
      }
      return `
        <g>
          <rect x="${x}" y="${y}" width="${width}" height="${height}" rx="8" fill="#eeeeeb" stroke="#bdbdb8"/>
          <text x="${x + width / 2}" y="${y + height / 2}" dominant-baseline="middle" text-anchor="middle" fill="#171717" font-family="Georgia, serif" font-size="${Math.max(22, Math.min(42, width / 4))}">키워드</text>
        </g>
      `;
    }

    function downloadBoardSvg() {
      const bounds = boardViewportBounds();
      const width = Math.max(1, Math.round(bounds.width));
      const height = Math.max(1, Math.round(bounds.height));
      const items = state.boardItems.map(boardItemSvg).join("");
      const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="${bounds.left} ${bounds.top} ${bounds.width} ${bounds.height}">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ddddda" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  ${items}
</svg>`;
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "forus-board.svg";
      link.click();
      URL.revokeObjectURL(url);
    }

    els.saveBoardImage.addEventListener("click", downloadBoardSvg);
    els.homeLogo.addEventListener("click", goHome);

    els.boardCanvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = els.boardCanvas.getBoundingClientRect();
      const cursorX = event.clientX - rect.left;
      const cursorY = event.clientY - rect.top;
      const before = boardPointFromEvent(event);
      const nextZoom = Math.max(0.45, Math.min(2.4, state.boardZoom + (event.deltaY < 0 ? 0.08 : -0.08)));
      state.boardZoom = nextZoom;
      state.boardPanX = cursorX - before.x * state.boardZoom;
      state.boardPanY = cursorY - before.y * state.boardZoom;
      updateBoardZoom();
    }, { passive: false });

    let boardMarquee = null;
    let boardPan = null;

    els.boardCanvas.addEventListener("pointerdown", (event) => {
      if (event.button === 1) {
        event.preventDefault();
        boardPan = {
          startX: event.clientX,
          startY: event.clientY,
          panX: state.boardPanX,
          panY: state.boardPanY
        };
        els.boardCanvas.classList.add("is-panning");
        els.boardCanvas.setPointerCapture(event.pointerId);
        return;
      }
      if (event.button !== 0 || (event.target !== els.boardCanvas && event.target !== els.boardZoomLayer)) return;
      const point = boardPointFromEvent(event);
      const box = document.createElement("div");
      box.className = "board-selection";
      els.boardZoomLayer.appendChild(box);
      if (!event.shiftKey) state.selectedBoardIds.clear();
      boardMarquee = {
        box,
        startX: point.x,
        startY: point.y
      };
      box.style.left = `${boardMarquee.startX}px`;
      box.style.top = `${boardMarquee.startY}px`;
      box.style.width = "0px";
      box.style.height = "0px";
      els.boardCanvas.setPointerCapture(event.pointerId);
      updateBoardSelectionStyles();
    });

    els.boardCanvas.addEventListener("pointermove", (event) => {
      if (boardPan) {
        state.boardPanX = boardPan.panX + event.clientX - boardPan.startX;
        state.boardPanY = boardPan.panY + event.clientY - boardPan.startY;
        updateBoardZoom();
        return;
      }
      if (!boardMarquee) return;
      const rect = els.boardCanvas.getBoundingClientRect();
      const point = boardPointFromEvent(event);
      const bounds = boardViewportBounds();
      const currentX = Math.max(bounds.left, Math.min(bounds.right, point.x));
      const currentY = Math.max(bounds.top, Math.min(bounds.bottom, point.y));
      const left = Math.min(boardMarquee.startX, currentX);
      const top = Math.min(boardMarquee.startY, currentY);
      const width = Math.abs(currentX - boardMarquee.startX);
      const height = Math.abs(currentY - boardMarquee.startY);
      boardMarquee.box.style.left = `${left}px`;
      boardMarquee.box.style.top = `${top}px`;
      boardMarquee.box.style.width = `${width}px`;
      boardMarquee.box.style.height = `${height}px`;
    });

    function finishBoardMarquee(event) {
      if (boardPan) {
        boardPan = null;
        els.boardCanvas.classList.remove("is-panning");
        if (els.boardCanvas.hasPointerCapture(event.pointerId)) {
          els.boardCanvas.releasePointerCapture(event.pointerId);
        }
        return;
      }
      if (!boardMarquee) return;
      const left = parseFloat(boardMarquee.box.style.left) || 0;
      const top = parseFloat(boardMarquee.box.style.top) || 0;
      const width = parseFloat(boardMarquee.box.style.width) || 0;
      const height = parseFloat(boardMarquee.box.style.height) || 0;
      const selectionRect = { left, top, right: left + width, bottom: top + height };
      state.boardItems.forEach((item) => {
        const itemRect = {
          left: item.left,
          top: item.top,
          right: item.left + (item.width || 136),
          bottom: item.top + (item.height || 104)
        };
        if (rectsOverlap(selectionRect, itemRect)) state.selectedBoardIds.add(item.id);
      });
      boardMarquee.box.remove();
      boardMarquee = null;
      updateBoardSelectionStyles();
      if (els.boardCanvas.hasPointerCapture(event.pointerId)) {
        els.boardCanvas.releasePointerCapture(event.pointerId);
      }
    }

    els.boardCanvas.addEventListener("pointerup", finishBoardMarquee);
    els.boardCanvas.addEventListener("pointercancel", finishBoardMarquee);

    els.boardCanvas.addEventListener("dragover", (event) => {
      event.preventDefault();
      els.boardCanvas.classList.add("is-over");
      event.dataTransfer.dropEffect = "copy";
    });

    els.boardCanvas.addEventListener("dragleave", () => {
      els.boardCanvas.classList.remove("is-over");
    });

    els.boardCanvas.addEventListener("drop", (event) => {
      event.preventDefault();
      els.boardCanvas.classList.remove("is-over");
      const raw = event.dataTransfer.getData("application/json");
      if (!raw) return;
      const data = JSON.parse(raw);
      const point = boardPointFromEvent(event);
      addBoardItem(data.refId, point.x - 68, point.y - 52);
    });

    renderTags();
    renderTopFocus();
    renderGrid();
    renderAlgorithm();
    renderBoard();
  </script>


</body></html>
